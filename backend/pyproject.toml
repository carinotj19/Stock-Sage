[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-sage-backend"
version = "0.1.0"
description = "Local AI-assisted inventory backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "numpy>=2.2.0",
  "pandas>=2.2.3",
  "pydantic>=2.10.6",
  "python-dotenv>=1.0.1",
  "psycopg[binary]>=3.2.9",
  "requests>=2.32.3",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]
forecast = [
  "statsmodels>=0.14.4",
  "xgboost>=2.1.2",
  "prophet>=1.1.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
